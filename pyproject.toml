[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "tea-data-file-conversion"
version = "1.4.0"
description = """\
  Fixedwidth Processor is a Python package designed to transform fixed-width text files into CSVs using dynamic YAML \
  schema configurations.\
  """
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Mark Moreno", email = "mamoreno@aldineisd.org" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "importlib-resources>=6.5.2",
  "pandas>=2.2.3",
  "pyyaml>=6.0.2",
  "rich>=10",
  "typer>=0.15,<1",
]
urls."Bug Tracker" = "https://github.com/markm-io/tea-data-file-conversion/issues"
urls.Changelog = "https://github.com/markm-io/tea-data-file-conversion/blob/main/CHANGELOG.md"
urls.documentation = "https://tea-data-file-conversion.readthedocs.io"
urls.repository = "https://github.com/markm-io/tea-data-file-conversion"
scripts.tea-data-file-conversion = "tea_data_file_conversion.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
]
docs = [
  "myst-parser>=0.16; python_version>='3.11'",
  "sphinx>=4; python_version>='3.11'",
  "sphinx-autobuild>=2024,<2025; python_version>='3.11'",
  "sphinx-wagtail-theme>=6.5",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  "docs/conf.py",
]
# Formatting Markdown here rewrites the Python code fences inside the specs and
# plans, changing the meaning of the snippets they document.
extend-exclude = [
  "docs/superpowers",
]
lint.select = [
  "B",   # flake8-bugbearlear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
  "S324", # Use of insecure MD2, MD4, MD5, or SHA1 hash function
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."setup.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
]
lint.isort.known-first-party = [ "tea_data_file_conversion", "tests" ]

[tool.mypy]
mypy_path = "src/"
exclude = [
  "docs/.*",
  "setup.py",
]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
overrides = [ { module = "tests.*", allow_untyped_defs = true }, { module = "docs.*", ignore_errors = true } ]
no_implicit_optional = true
show_error_codes = true

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = """\
    -v
    -Wdefault
    --cov=tea_data_file_conversion
    --cov-report=term
    --cov-report=xml
    """

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
version_variables = [
  "src/tea_data_file_conversion/__init__.py:__version__",
  "docs/conf.py:release",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''refactor(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
  '''build\((?!deps\): .+)''',
  "Merged? .*",
  "Initial [Cc]ommit.*",             # codespell:ignore
]
